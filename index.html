<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chasse de Wolmar | Carte 3D</title>

    <!-- PWA: add-to-home-screen, standalone display (see public/manifest.webmanifest and public/sw.js, registered in main.tsx) -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#14100c" />
    <link rel="icon" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wolmar" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      The map's tile sources (see mapStyle.ts / historicalImagery.ts) — the
      default satellite basemap and the vector basemap (both MapTiler) and
      the terrain DEM (AWS) all start fetching the moment the map mounts, so
      getting the DNS/TLS handshake with each host out of the way early
      shaves real time off the first tiles painting. The Esri Wayback host
      used for historical-year imagery isn't preconnected since it's a
      secondary feature, not on the default-load critical path.
    -->
    <link rel="preconnect" href="https://api.maptiler.com" />
    <link rel="preconnect" href="https://s3.amazonaws.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
